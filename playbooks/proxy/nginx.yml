- name: install nginx
  hosts: proxy
  vars:
    srv: nginx
  become: true
  tasks:
  - name: install {{ srv }}
    pkgng:
      name: '{{ srv }}''
  - name: add {{ srv }} runsv directory
    ansible.builtin.file:
      path: '/etc/sv/{{ srv }}'
      state: directory
      mode: '0755'
  - name: add {{ srv }} runsv file
    ansible.builtin.file:
      src: '../../templates/runit/{{ srv }}_run'
      path: '/etc/sv/{{ srv }}/run'
      owner: root
      group: wheel
      mode: '0755'
  - name: enable {{ srv }} boot
    ansible.builtin.file:
      src: '/etc/sv/{{ srv }}'
      dest: '/var/service/{{ srv }}'
      state: link
  - name: restart nginx
    community.general.runit:
      name: '{{ srv }}'
      state: restarted