FileSet {
  Name = "UNIX-zfs-vss"
  Include {
    Options {
      Signature = XXH128 # calculate md5 checksum per file
      Compression = LZ4
      One FS = No     # change into other filessytems
      FS Type = zfs
      noatime = yes
      Honor No Dump Flag = Yes
      Sparse = yes
      Strip Path = 1
      WildFile = "*.core"
      WildFile = "*/bhyve/*/*.img"
      WildDir = "*/etc/sv/*/supervise"
      WildDir = "*/poudriere/data/logs/*"
      WildDir = "*/poudriere/obj/*"
      WildDir = "*/usr/obj"
      WildDir = "*/var/cache"
      WildDir = "*/var/run"
      WildDir = "*/var/tmp"
      WildDir = "*/jail/*/tmp"
      WildDir = "*/.ccache"
      WildDir = "*/ccache"
      WildDir = "*/.m"
      WildDir = "*/.zfs"
      Exclude = yes
    }
    File = /zfs_vss_copy
  }
  # Things that usually have to be excluded
  # You have to exclude /tmp
  # on your bareos server
  Exclude {
    File = /zfs_vss_copy/appdata
    File = /zfs_vss_copy/var/db/bareos
    File = /zfs_vss_copy/tmp
    File = /zfs_vss_copy/proc
    File = /zfs_vss_copy/sys
  }
}

