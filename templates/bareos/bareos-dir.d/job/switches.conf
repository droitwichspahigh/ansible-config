Job {
  Name = "switches"
  Description = "Pick up switch config files and back them up"
  JobDefs = "DefaultJob"
  Level = Full
  Pool = Full
  FileSet = "Switches"
  Schedule = "WeeklyCycleAfterBackup"
  Client Run Before Job = "/usr/local/etc/bareos/switch_backups.sh"
}
Job {
  Name = "switches-offsite"
  Description = "Pick up switch config files and back them up"
  JobDefs = "DefaultJob"
  Level = Full
  Pool = Offsite-full
  FileSet = "Switches-offsite"
  Schedule = "WeeklyCycleAfterBackup"
  Client Run Before Job = "/usr/local/etc/bareos/switch_backups.sh"
}
