Job {
  Name = RsyncOffsite
  Description = "Rsync offsite backup"
  Type = Backup
  Schedule = "WeeklyCycleAfterBackup"
  Client = dshs-backup-j1
  JobDefs = DefaultJob
  Fileset = RsyncOffsite
  Priority = 12                   # run after main backup

  Run Script {
    Command = "/bin/sh -c '/bin/sh /usr/local/etc/bareos/borg_backup.sh %i </dev/null >/dev/null 2>&1 &'"
    RunsWhen = After
    RunsOnClient = Yes
  }
}

Fileset {
  Name = RsyncOffsite
  Include {
    File = /var/empty
  }
}
